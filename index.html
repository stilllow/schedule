.gl,dialog,#nav,.badge,#burger,.wds{background:linear-gradient(135deg,rgba(255,255,255,var(--ha,.2)),rgba(255,255,255,.03) 55%,rgba(255,255,255,.06)),var(--gl);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gb);box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.5),inset -1px -1px 1px rgba(255,255,255,.16),inset 0 0 26px rgba(255,255,255,.08),0 14px 38px var(--sh,rgba(0,0,0,.24))}
.card{border-radius:28px;padding:14px 16px}dialog{border-radius:32px}.badge{border-radius:999px}

.btn .i{width:18px;height:18px}

.ib,.ti{border:1px solid var(--gb);background:rgba(255,255,255,.12);color:inherit;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.4),inset -1px -1px 1px rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib{width:38px;height:38px;padding:0;border-radius:14px;color:var(--tx);cursor:pointer}.ti{width:40px;height:40px;border-radius:14px}

const DAYAB={'Пн':'Mon','Вт':'Tue','Ср':'Wed','Чт':'Thu','Пт':'Fri','Сб':'Sat','Вс':'Sun'};
const PAT=[
 [/^(\d+) мин до начала$/,'$1 min before start'],[/^ауд\. (.+)$/,'Room $1'],[/^(\d+) пара$/,'Pair $1'],[/^до (.+)$/,'until $1'],
 [/^Каникулы: (.+)$/,'Holidays: $1'],[/^Вы вошли как (.+)$/,'Signed in as $1'],[/^Ошибка: (.+)$/,'Error: $1'],
 [/^Ошибка загрузки: (.+)\. Выполнен ли migration_v2\.sql\?$/,'Load error: $1. Did you run migration_v2.sql?'],
 [/^Не удалось сохранить: (.+)$/,'Could not save: $1'],[/^Не удалось удалить: (.+)\. Выполнен ли migration_v3\.sql\?$/,'Could not delete: $1. Did you run migration_v3.sql?'],
 [/^Город: (.+)$/,'City: $1'],
 [/^(.+), ощущается (-?\d+)°$/,(m,a,b)=>T1(a)+', feels like '+b+'°'],
 [/^(.+) в (\d\d:\d\d)(?:, ауд\. (.+))?$/,(m,a,b,c)=>a+' at '+b+(c?', room '+c:'')],
 [/^Текущий город: (.+)\. Хранится на этом устройстве\. Виджет виден на компьютере при ширине окна от 1100 px\.$/,'Current city: $1. Stored on this device. The widget is visible on desktop for window widths from 1100 px.']];
function T1(s){if(D[s])return D[s];for(const [r,v] of PAT)if(r.test(s))return s.replace(r,v);return s}
function T(s){s=String(s);if(LANG!=='en')return s;if(D[s])return D[s];const r=s.includes(' · ')?s.split(' · ').map(T1).join(' · '):T1(s);return r.replace(/\((Пн|Вт|Ср|Чт|Пт|Сб), /g,(m,d)=>'('+DAYAB[d]+', ')}
/*END*/
const ATT=['placeholder','aria-label','title'];
function trNode(n){
 if(!n)return;
 if(n.nodeType===3){const p=n.parentNode;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))return;if(n._ru===undefined)n._ru=n.nodeValue;const m=n._ru.match(/^(\s*)([\s\S]*?)(\s*)$/);n.nodeValue=LANG==='en'&&m[2]?m[1]+T(m[2])+m[3]:n._ru;return}
 if(n.nodeType!==1)return;
 [n,...n.querySelectorAll('*')].forEach(e=>ATT.forEach(a=>{if(e.hasAttribute(a)){e._ra=e._ra||{};if(e._ra[a]===undefined)e._ra[a]=e.getAttribute(a);e.setAttribute(a,LANG==='en'?T(e._ra[a]):e._ra[a])}}));
 const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode())trNode(x);
}
new MutationObserver(ms=>{if(LANG!=='en')return;ms.forEach(m=>m.addedNodes.forEach(trNode))}).observe(document.body,{childList:true,subtree:true});

const closeDD=()=>$$('.dl').forEach(l=>l.hidden=true);
function enhance(){
 $$('select:not([data-e])').forEach(sel=>{
  sel.dataset.e=1;sel.style.display='none';
  const d=document.createElement('div');d.className='dd';
  d.innerHTML='<button type="button" class="dv" aria-haspopup="listbox"><span></span>'+ic('down')+'</button><div class="dl" hidden></div>';
  sel.after(d);
  const b=d.querySelector('.dv'),l=d.querySelector('.dl'),sp=b.firstChild;
  l.innerHTML=[...sel.options].map((o,i)=>`<button type="button" data-i="${i}">${esc(o.text)}</button>`).join('');
  const sync=()=>{sp.textContent=sel.selectedIndex>=0?sel.options[sel.selectedIndex].text:'';[...l.children].forEach((o,i)=>o.classList.toggle('on',i===sel.selectedIndex))};
  sync();
  b.onclick=e=>{e.stopPropagation();const was=!l.hidden;closeDD();if(!was){l.hidden=false;const r=b.getBoundingClientRect();d.classList.toggle('up',innerHeight-r.bottom<260&&r.top>innerHeight-r.bottom)}};
  l.onclick=e=>{const x=e.target.closest('button');if(!x)return;e.stopPropagation();sel.selectedIndex=+x.dataset.i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();closeDD()};
 });
}
